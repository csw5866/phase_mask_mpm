# Simulation Configuration
device: "cpu"

# [핵심] 고해상도 그리드 및 조밀한 입자 설정
grid_res: [129, 129, 129]     # 65*65*65 grid 배치,간격은 1/(65-1) = 0.015625
spacing: 0.01         # 입자 간격을 매우 좁혀서 밀도를 높임 (가장 중요) -> 현재 코드 상으로는 spacing 대신 grid_res 기반 dx에 3개씩 배치되도록 설계
dt: 1e-4              # 입자가 작아진 만큼 타임스텝도 줄여야 안정적

steps: 600
gravity: [0, 0, 0]    # 실제로는 [0, -9.8, 0] (-y축 방향)

# Material (PDMS-like)
E: 1e5   # 밀도가 높아져서 강성을 조금 높여도 됨
nu: 0.4    # 고무에 가까운 거동을 위해 높임 (비압축성 근사)
density: 1000.0

# Geometry
block_min: [0.3, 0.05, 0.3] # xz 평면에 배치되고 y방향으로 눌린다. (y방향기준 대략 12.8개의 grid가 포함됨)
block_max: [0.7, 0.25, 0.7] # 블록 높이를 조금 낮춤


# indentation.yaml
#cad_model:
#  enabled: true
  # main.py가 있는 폴더 기준 상대 경로
#  path: "assets/my_sensor_model.stl"
  # 모델이 너무 크거나 작을 때 조절 (mm -> m 변환 등)
#  scale: 0.001 
  # 모델을 블록 위(0.25)로 옮기기 위한 좌표
#  offset: [0.5, 0.25, 0.5]

stl_path: "input/square.stl"

# Indenter (Kinematic Rigid)
indenter:
  center: [0.5, 0.35, 0.5] # 블록 바로 위에서 시작
  radius: 0.08
  velocity: [0, -0.75, 0] # 적절한 속도로 압입

# Visualization
output_dir: "output"
save_gif: true
show_window: true